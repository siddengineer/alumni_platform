spring.application.name=alumni-platform

# ── DATABASE ──
spring.datasource.url=jdbc:mysql://localhost:3306/alumni_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── SERVER ──
server.port=8080

# ── JWT ──
jwt.secret=THIS_IS_A_VERY_LONG_256_BIT_SECRET_KEY_FOR_HS256_ALGORITHM
jwt.expiration=86400000

# ── RAZORPAY ──
razorpay.key=
razorpay.secret=

# ── CACHE (simple in-memory, no Redis needed) ──
spring.cache.type=simple

# ── LOGGING ──
logging.level.root=WARN
logging.level.com.college.platform=INFO